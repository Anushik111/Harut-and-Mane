<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Հարություն & Մանե • Հարսանեկան Հրավեր</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fcfbfa;
            color: #2c2c2c;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
        }
        .invitation-card {
            max-width: 650px;
            margin: 40px auto;
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            border: 1px solid #efeae2;
        }
        .top-text {
            font-size: 1.1rem;
            color: #6b635b;
            margin-bottom: 25px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .names {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: #4a3b32;
            margin: 20px 0;
            font-weight: 600;
        }
        .ampersand {
            color: #b59a7a;
            font-style: italic;
        }
        .date-box {
            font-size: 1.4rem;
            color: #5a4f47;
            margin: 25px 0;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }
        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 35px 0;
        }
        .time-block {
            background: #f9f6f0;
            padding: 15px 20px;
            border-radius: 8px;
            min-width: 60px;
        }
        .time-number {
            font-size: 1.5rem;
            font-weight: 600;
            color: #4a3b32;
        }
        .time-label {
            font-size: 0.8rem;
            color: #8c7b6f;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .message {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #555;
            margin: 30px 0;
        }
        .btn {
            display: inline-block;
            background-color: #4a3b32;
            color: #ffffff;
            padding: 14px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 1rem;
            letter-spacing: 1px;
            transition: background 0.3s ease;
            box-shadow: 0 4px 10px rgba(74, 59, 50, 0.2);
        }
        .btn:hover {
            background-color: #362a23;
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="top-text">Սիրով հրավիրում ենք ձեզ կիսելու մեզ հետ մեր կյանքի ամենակարևոր օրը</div>
        
        <div class="names">Հարություն <span class="ampersand">&</span> Մանե</div>
        
        <div class="date-box">10 ․ 07 ․ 2027</div>

        <!-- Ժամացույց-հետհաշվարկ -->
        <div class="countdown" id="countdown">
            <div class="time-block">
                <div class="time-number" id="days">00</div>
                <div class="time-label">Օր</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">Ժամ</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">Րոպե</div>
            </div>
            <div class="time-block">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">Վայրկյան</div>
            </div>
        </div>

        <div class="message">
            Մանրամասների և ներկա գտնվելու մասին մեզ տեղեկացնելու համար խնդրում ենք սեղմել ստորև գտնվող կոճակը:
        </div>
        
        <a href="#rsvp" class="btn">Հաստատել մասնակցությունը</a>
    </div>

    <script>
        // Հետհաշվարկի տրամաբանություն մինչև հարսանիքի օրը
        const weddingDate = new Date("July 10, 2027 00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const gap = weddingDate - now;

            if (gap < 0) return;

            const second = 1000;
            const minute = second * 60;
            const hour = minute * 60;
            const day = hour * 24;

            document.getElementById("days").innerText = Math.floor(gap / day);
            document.getElementById("hours").innerText = Math.floor((gap % day) / hour);
            document.getElementById("minutes").innerText = Math.floor((gap % hour) / minute);
            document.getElementById("seconds").innerText = Math.floor((gap % minute) / second);
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
